<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 Sweepstake - Frive</title>
  <style>
    /* ── Frive Fonts ── */
    @font-face { font-family: FriveJokker; font-weight: 900; src: url("fonts/JokkerTRIAL-Heavy.otf") format("opentype"); font-display: swap; }
    @font-face { font-family: FriveJokker; font-weight: 700; font-style: normal; src: url("fonts/FriveJokker-Bold.ttf") format("truetype"); font-display: swap; }
    @font-face { font-family: FriveJokker; font-weight: 700; font-style: italic; src: url("fonts/FriveJokker-BoldItalic.ttf") format("truetype"); font-display: swap; }
    @font-face { font-family: FriveJokker; font-weight: 500; font-style: normal; src: url("fonts/FriveJokker-Medium.ttf") format("truetype"); font-display: swap; }
    @font-face { font-family: FriveJokker; font-weight: 400; font-style: normal; src: url("fonts/FriveJokker-Regular.ttf") format("truetype"); font-display: swap; }

    :root {
      --kale: #053827;
      --lime: #C6F432;
      --cream-banner: #FFF7E8;
      --border: #E0E0E0;
      --grey-60: #666;
      --grey-80: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: FriveJokker, Arial, sans-serif;
      background: #FAFAFA;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── HEADER ── */
    header {
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ── INFO BAR ── */
    .info-bar-wrap { background: var(--cream-banner); border-bottom: 1px solid #E8D7B8; }
    .info-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 24px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: var(--grey-80);
    }
    .urgency-bar-track {
      height: 4px;
      background: #E8D7B8;
      width: 100%;
    }
    .urgency-bar-fill {
      height: 4px;
      background: var(--kale);
      width: 0%;
      transition: width 0.8s ease;
    }

    /* ── MAIN ── */
    .main-content {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ── HERO ── */
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }
    .hero-badge {
      display: inline-block;
      background: var(--lime);
      color: var(--kale);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 900;
      color: var(--kale);
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 16px;
      color: var(--grey-60);
      font-weight: 400;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── ENTRY CARD ── */
    .entry-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
    }
    .entry-card label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--kale);
      margin-bottom: 8px;
    }
    .entry-card input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-family: FriveJokker, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--grey-80);
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      background: #FAFAFA;
    }
    .entry-card input[type="text"]:focus {
      border-color: var(--kale);
      background: white;
    }
    .entry-card input[type="text"]::placeholder {
      color: #bbb;
      font-weight: 400;
    }

    .generate-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      background: var(--kale);
      color: white;
      font-family: FriveJokker, Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .generate-btn:hover:not(:disabled) { background: #074d35; }
    .generate-btn:active:not(:disabled) { transform: scale(0.99); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── SPINNER / SLOT MACHINE ── */
    .slot-wrap {
      display: none;
      text-align: center;
      margin-bottom: 32px;
    }
    .slot-wrap.visible { display: block; }

    .slot-drum {
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      margin-bottom: 16px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .slot-flag {
      font-size: 72px;
      line-height: 1;
      transition: opacity 0.08s ease;
    }
    .slot-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--grey-80);
      margin-top: 10px;
      min-height: 26px;
      transition: opacity 0.08s ease;
    }

    /* ── RESULT CARD ── */
    .result-card {
      display: none;
      background: var(--kale);
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      margin-bottom: 32px;
      animation: fadeInUp 0.5s ease;
    }
    .result-card.visible { display: block; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-card .result-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 8px;
    }
    .result-card .result-name {
      font-size: 15px;
      color: rgba(255,255,255,0.7);
      font-weight: 500;
      margin-bottom: 20px;
    }
    .result-card .result-flag {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 14px;
      display: block;
    }
    .result-card .result-country {
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 900;
      color: white;
      line-height: 1.1;
    }
    .result-card .result-group {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      margin-top: 8px;
      font-weight: 400;
    }

    /* ── NOT HAPPY BUTTON ── */
    .not-happy-btn {
      display: none;
      margin: 22px auto 0;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.75);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      width: 100%;
    }
    .not-happy-btn:hover {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }
    .not-happy-btn.visible { display: block; }

    /* ── UNLUCKY MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.visible { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px 28px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .modal-box .modal-emoji { font-size: 48px; margin-bottom: 14px; }
    .modal-box .modal-title {
      font-family: 'FriveJokker', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--kale);
      margin-bottom: 10px;
      line-height: 1.2;
    }
    .modal-box .modal-body {
      font-size: 15px;
      color: #444;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .modal-box .modal-close {
      background: var(--kale);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    /* ── LEADERBOARD ── */
    .leaderboard {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .leaderboard-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .leaderboard-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--kale);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .leaderboard-count {
      font-size: 13px;
      color: var(--grey-60);
    }

    .country-row {
      display: flex;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid #F0F0F0;
      gap: 14px;
      transition: background 0.15s;
    }
    .country-row:last-child { border-bottom: none; }
    .country-row:hover { background: #FAFAFA; }
    .country-row.is-mine { background: #F0F9F4; }

    .country-flag-cell { font-size: 28px; line-height: 1; flex-shrink: 0; }
    .country-info { flex: 1; min-width: 0; }
    .country-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--grey-80);
    }
    .country-assignee {
      font-size: 13px;
      color: var(--grey-60);
      font-weight: 400;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .country-unassigned .country-name { color: #bbb; font-weight: 400; }
    .country-unassigned .country-assignee { color: #ddd; }

    .country-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .badge-mine { background: var(--lime); color: var(--kale); }
    .badge-taken { background: #F0F0F0; color: #999; }

    /* ── GROUP DIVIDER ── */
    .group-divider {
      background: #F7F7F7;
      padding: 8px 24px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #aaa;
      text-transform: uppercase;
      border-bottom: 1px solid #F0F0F0;
    }

    /* ── LOADING / ERROR ── */
    .loading-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--grey-60);
      font-size: 15px;
    }
    .loading-spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--kale);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #FFF3F3;
      border: 1px solid #FFCDD2;
      color: #C62828;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    @media (max-width: 480px) {
      .entry-card { padding: 24px 20px; }
      .result-card { padding: 28px 20px; }
      .country-row { padding: 12px 16px; }
      .leaderboard-header { padding: 16px 16px 12px; }
      .group-divider { padding: 8px 16px; }
    }
  </style>
</head>

  <div class="info-bar-wrap">
    <div class="info-bar" id="info-bar">⚽ FIFA World Cup 2026 — Draw your country!</div>
    <div class="urgency-bar-track">
      <div class="urgency-bar-fill" id="urgency-bar-fill"></div>
    </div>
  </div>

  <div class="main-content">
    <div id="error-container"></div>

    <!-- Loading -->
    <div class="loading-state" id="loading-state">
      <div class="loading-spinner"></div>
      <p>Loading sweepstake...</p>
    </div>

    <!-- Hero -->
    <div class="hero" id="hero-section" style="display:none;">
      <div class="hero-badge">World Cup 2026</div>
      <h1>Frive Sweepstake</h1>
      <p>Enter your name and draw a random country. 48 nations, one winner — good luck!</p>
    </div>

    <!-- Entry form (shown to new users) -->
    <div class="entry-card" id="entry-card" style="display:none;">
      <label for="name-input">Your name</label>
      <input type="text" id="name-input" placeholder="e.g. Katie Saunders" maxlength="60" autocomplete="off" />
      <button class="generate-btn" id="generate-btn" onclick="handleGenerate()">
        Generate My Country
      </button>
    </div>

    <!-- Slot machine animation -->
    <div class="slot-wrap" id="slot-wrap">
      <div class="slot-drum">
        <div class="slot-flag" id="slot-flag">🌍</div>
        <div class="slot-name" id="slot-name"></div>
      </div>
    </div>

    <!-- Result card (shown after draw or on return visit) -->
    <div class="result-card" id="result-card">
      <div class="result-label">Your country</div>
      <div class="result-name" id="result-greeting"></div>
      <span class="result-flag" id="result-flag"></span>
      <div class="result-country" id="result-country"></div>
      <div class="result-group" id="result-group"></div>
      <button class="not-happy-btn" id="not-happy-btn" onclick="showUnluckyModal()">Not happy with your team? 😬</button>
    </div>

    <!-- Unlucky modal -->
    <div class="modal-overlay" id="unlucky-modal" onclick="hideUnluckyModal(event)">
      <div class="modal-box">
        <div class="modal-emoji">😬</div>
        <div class="modal-title">Unlucky!</div>
        <div class="modal-body" id="unlucky-modal-text">That's not how sweepstakes work — you're stuck with <strong></strong>! Good luck 🤞</div>
        <button class="modal-close" onclick="hideUnluckyModal()">Fine... 😤</button>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="leaderboard" id="leaderboard" style="display:none;">
      <div class="leaderboard-header">
        <h2>All countries</h2>
        <span class="leaderboard-count" id="leaderboard-count"></span>
      </div>
      <div id="leaderboard-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"
    integrity="sha384-z4iWwfGok6nwo14qorcgp9QHDhY0q4kM3S2mWKmdxg/N9+jiyxlx6oqp6vHl3t8V"
    crossorigin="anonymous"></script>
  <script src="config.local.js" onerror="/* production — credentials injected server-side */"></script>

  <script>
    // ─── CONFIG ────────────────────────────────────────────────
    const SUPABASE_URL = (window.FRIVE_LOCAL_CONFIG && window.FRIVE_LOCAL_CONFIG.SUPABASE_URL) || '{{SUPABASE_URL}}';
    const SUPABASE_ANON_KEY = (window.FRIVE_LOCAL_CONFIG && window.FRIVE_LOCAL_CONFIG.SUPABASE_ANON_KEY) || '{{SUPABASE_ANON_KEY}}';
    const COOKIE_NAME = 'frive_sweepstake_2026';
    const COOKIE_DAYS = 365;

    if (SUPABASE_URL.includes('{{') || SUPABASE_ANON_KEY.includes('{{')) {
      document.body.innerHTML = '<div style="text-align:center;padding:50px;"><h1>Configuration Error</h1><p>Please contact support.</p></div>';
      throw new Error('Configuration error');

    // ─── COOKIE HELPERS ────────────────────────────────────────
    function setCookie(name, value, days) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
    }
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return match ? decodeURIComponent(match[1]) : null;
    }

    // ─── STORAGE HELPERS (localStorage + cookie fallback) ─────
    function saveEntry(name, code) {
      const val = JSON.stringify({ name, code });
      try { localStorage.setItem(COOKIE_NAME, val); } catch(e) {}
      setCookie(COOKIE_NAME, val, COOKIE_DAYS);
    }

    function loadEntry() {
      // Try localStorage first, then cookie
      try {
        const ls = localStorage.getItem(COOKIE_NAME);
        if (ls) return JSON.parse(ls);
      } catch(e) {}
      try {
        const c = getCookie(COOKIE_NAME);
        if (c) return JSON.parse(c);
      } catch(e) {}
      return null;
    }

    // ─── URGENCY BAR ───────────────────────────────────────────
    function updateUrgencyBar(taken, total) {
      const pct = (taken / total) * 100;
      document.getElementById('urgency-bar-fill').style.width = pct + '%';

      const left = total - taken;
      const infoBar = document.getElementById('info-bar');
      let msg;

      if (left === 0) {
        msg = '🔴 Sweepstake is full — all 48 countries have been drawn!';
      } else if (left <= 4) {
        msg = `🔴 Only ${left} countr${left === 1 ? 'y' : 'ies'} left — grab yours before it's gone!`;
      } else if (left <= 10) {
        msg = `🟠 Almost full! Just ${left} countries remaining out of 48.`;
      } else if (pct >= 50) {
        msg = `🟡 Over half gone — ${left} countries still available.`;
      } else if (taken > 0) {
        msg = `⚽ ${taken} of 48 countries drawn so far — ${left} still up for grabs!`;
      } else {
        msg = '⚽ FIFA World Cup 2026 — be the first to draw a country!';
      }

      infoBar.textContent = msg;
    }

    function showError(msg) {
      const el = document.getElementById('error-container');
      el.innerHTML = `<div class="error-msg">${msg}</div>`;
    }

    // ─── SLOT MACHINE ANIMATION ────────────────────────────────
    function runSlotAnimation(finalCountry, callback) {
      const flagEl  = document.getElementById('slot-flag');
      const nameEl  = document.getElementById('slot-name');
      const slotWrap = document.getElementById('slot-wrap');

      slotWrap.classList.add('visible');

      let cycles = 0;
      const totalCycles = 28; // fast → slow
      const allFlags = COUNTRIES.map(c => c.flag);

      function tick() {
        const idx = Math.floor(Math.random() * allFlags.length);
        const country = COUNTRIES[idx];
        flagEl.textContent = country.flag;
        nameEl.textContent = country.name;

        cycles++;
        // Exponential slowdown
        const delay = cycles < 12 ? 80
                    : cycles < 20 ? 160
                    : cycles < 25 ? 280
                    : 420;

        if (cycles < totalCycles) {
          setTimeout(tick, delay);
        } else {
          // Land on the final country
          flagEl.textContent = finalCountry.flag;
          nameEl.textContent = finalCountry.name;
          setTimeout(() => {
            slotWrap.classList.remove('visible');
            callback();
          }, 800);
        }
      }
      tick();
    }

    // ─── SHOW RESULT ───────────────────────────────────────────
    function showResult(name, country) {
      document.getElementById('result-greeting').textContent = `Good luck, ${name}!`;
      document.getElementById('result-flag').textContent = country.flag;
      document.getElementById('result-country').textContent = country.name;
      document.getElementById('result-group').textContent = country.group;
      document.getElementById('result-card').classList.add('visible');
      // Set modal text and show the "not happy" button
      const strong = document.querySelector('#unlucky-modal-text strong');
      if (strong) strong.textContent = `${country.flag} ${country.name}`;
      document.getElementById('not-happy-btn').classList.add('visible');
    }

      document.getElementById('unlucky-modal').classList.add('visible');

    function hideUnluckyModal(e) {
      // Close if clicking the overlay background or the button
      if (!e || e.target === document.getElementById('unlucky-modal') || e.type === 'click') {
        document.getElementById('unlucky-modal').classList.remove('visible');
      }
    }

    // ─── LEADERBOARD ───────────────────────────────────────────
    async function loadLeaderboard(myCountryCode) {
      const { data, error } = await db
        .from('sweepstake_2026')
        .select('name, country_code');

      const leaderboard = document.getElementById('leaderboard');
      const body = document.getElementById('leaderboard-body');
      const countEl = document.getElementById('leaderboard-count');
      leaderboard.style.display = 'block';

      if (error) {
        body.innerHTML = '<div style="padding:20px;color:#999;font-size:14px;">Could not load entries.</div>';
        return;
      }

      // Map country_code → name
      const assignees = {};
      (data || []).forEach(row => { assignees[row.country_code] = row.name; });

      const taken = Object.keys(assignees).length;
      countEl.textContent = `${taken} / ${COUNTRIES.length} drawn`;
      updateUrgencyBar(taken, COUNTRIES.length);
      // Group countries
      const groups = {};
      COUNTRIES.forEach(c => {
        if (!groups[c.group]) groups[c.group] = [];
        groups[c.group].push(c);
      });

      body.innerHTML = '';
      Object.entries(groups).forEach(([groupName, countries]) => {
        // Group divider
        const div = document.createElement('div');
        div.className = 'group-divider';
        div.textContent = groupName;
        body.appendChild(div);

        countries.forEach(c => {
          const assignee = assignees[c.code];
          const isMe = c.code === myCountryCode;
          const row = document.createElement('div');
          row.className = 'country-row' + (isMe ? ' is-mine' : '') + (!assignee ? ' country-unassigned' : '');

          row.innerHTML = `
            <div class="country-flag-cell">${c.flag}</div>
            <div class="country-info">
              <div class="country-name">${c.name}</div>
              <div class="country-assignee">${assignee || 'Not yet drawn'}</div>
            </div>
            ${isMe ? '<span class="country-badge badge-mine">You</span>' : assignee ? '<span class="country-badge badge-taken">Taken</span>' : ''}
          `;
          body.appendChild(row);
        });
      });
    }

    // ─── GENERATE HANDLER ──────────────────────────────────────
    async function handleGenerate() {
      const nameInput = document.getElementById('name-input');
      const name = nameInput.value.trim();

      if (!name) {
        nameInput.focus();
        nameInput.style.borderColor = '#E53935';
        setTimeout(() => { nameInput.style.borderColor = ''; }, 1500);
        return;
      }

      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.textContent = 'Drawing...';
      document.getElementById('error-container').innerHTML = '';

      try {
        await drawCountry(name, 0);
      } catch (err) {
        console.error(err);
        showError('Something went wrong. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Generate My Country';
      }
    }

    // Recursive draw — retries up to 3 times if a race collision occurs
    async function drawCountry(name, attempt) {
      const MAX_ATTEMPTS = 3;

      // Fetch already-assigned codes
      const { data: existing, error: fetchErr } = await db
        .from('sweepstake_2026')
        .select('country_code');

      if (fetchErr) throw fetchErr;

      const taken = new Set((existing || []).map(r => r.country_code));
      const available = COUNTRIES.filter(c => !taken.has(c.code));

      if (available.length === 0) {
        showError('All 48 countries have been drawn! The sweepstake is full.');
        const btn = document.getElementById('generate-btn');
        btn.disabled = false;
        btn.textContent = 'Generate My Country';
        return;
      }

      // Pick random available country
      const chosen = available[Math.floor(Math.random() * available.length)];

      // Attempt insert
      const { error: insertErr } = await db
        .from('sweepstake_2026')
        .insert([{ name, country_code: chosen.code }]);

      if (insertErr) {
        // 23505 = unique_violation — someone grabbed this country a split-second earlier
        const isCollision = insertErr.code === '23505' || (insertErr.message && insertErr.message.includes('unique'));

        if (isCollision && attempt < MAX_ATTEMPTS) {
          showError(`Bad luck — ${chosen.name} was just taken by someone else! Re-drawing for you...`);
          // Short pause so the message is readable, then retry
          await new Promise(r => setTimeout(r, 1800));
          document.getElementById('error-container').innerHTML = '';
          return drawCountry(name, attempt + 1);
        }

        if (isCollision) {
          showError('Several countries were taken at the same time. Please click Generate again.');
          const btn = document.getElementById('generate-btn');
          btn.disabled = false;
          btn.textContent = 'Generate My Country';
          return;
        }

        throw insertErr;
      }

      // Success — lock in and show result
      saveEntry(name, chosen.code);
      document.getElementById('entry-card').style.display = 'none';

      runSlotAnimation(chosen, () => {
        showResult(name, chosen);
        loadLeaderboard(chosen.code);
      });
    }

    // Allow Enter key in name input
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('name-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleGenerate();
      });
    });

    // ─── INIT ──────────────────────────────────────────────────
    async function init() {
      const loading = document.getElementById('loading-state');
      const hero = document.getElementById('hero-section');
      const entryCard = document.getElementById('entry-card');

      const entry = loadEntry();

      if (entry) {
        // Returning user — show their result without entry form
        try {
          const { name, code } = entry;
          const country = COUNTRIES.find(c => c.code === code);
          if (country) {
            loading.style.display = 'none';
            hero.style.display = 'block';
            showResult(name, country);
            loadLeaderboard(code);
            return;
          }
        } catch (e) { /* bad data — fall through */ }
      }

      // New user
      loading.style.display = 'none';
      hero.style.display = 'block';
      entryCard.style.display = 'block';
      loadLeaderboard(null);
    }

    init();
